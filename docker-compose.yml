services:
  ollama:
    image: ollama/ollama
    container_name: ollama
    volumes:
      - ollama:/root/.ollama
    ports:
      - "11434:11434"

  api:
    build: .
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      OLLAMA_BASE: http://ollama:11434
      DB_PATH: /data/jarvis.db
    volumes:
      - jarvis-data:/data
    depends_on:
      - ollama

volumes:
  ollama:
    external: true
  jarvis-data: